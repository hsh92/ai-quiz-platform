<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서비스 일시 중단 | AI 퀴즈 플랫폼</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #020617 0%, #1e1b4b 50%, #020617 100%);
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #e2e8f0;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        text-align: center;
        padding: 2.5rem;
        border-radius: 1rem;
        border: 1px solid rgba(100, 116, 139, 0.4);
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
      }
      .icon { font-size: 3rem; margin-bottom: 1rem; }
      h1 { font-size: 1.5rem; margin-bottom: 0.75rem; color: #fff; }
      p { font-size: 0.95rem; line-height: 1.6; color: #94a3b8; }
      .badge {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.35rem 0.85rem;
        border-radius: 9999px;
        background: rgba(99, 102, 241, 0.2);
        color: #a5b4fc;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🔧</div>
      <h1>서비스 일시 중단</h1>
      <p>
        AI 퀴즈 플랫폼은 현재 점검 중입니다.<br />
        잠시 후 다시 이용해 주세요.
      </p>
      <span class="badge">점검 중</span>
    </div>
  </body>
</html>
